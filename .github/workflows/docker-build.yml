name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Environment Config
        id: env-config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DOCKER_TAG=latest" >> $GITHUB_OUTPUT
            echo "COMPOSE_SERVICE=chat" >> $GITHUB_OUTPUT
            echo "DEV_FLAG=false" >> $GITHUB_OUTPUT
          else
            echo "DOCKER_TAG=dev" >> $GITHUB_OUTPUT
            echo "COMPOSE_SERVICE=chat-dev" >> $GITHUB_OUTPUT
            echo "DEV_FLAG=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_ENABLE_DEV_LOGIN=${{ steps.env-config.outputs.DEV_FLAG }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/anticeil-chat:${{ steps.env-config.outputs.DOCKER_TAG }}
            ghcr.io/${{ github.repository_owner }}/anticeil-chat:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,TAG_NAME
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/anticeil-chat:$TAG_NAME
            if [ "$TAG_NAME" = "dev" ]; then
              docker stop anticeil_chat_dev 2>/dev/null || true
              docker rm anticeil_chat_dev 2>/dev/null || true
              NET=$(docker inspect anticeil-chat --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' 2>/dev/null || echo "bridge")
              docker run -d --name anticeil_chat_dev --network "$NET" -p 3006:3005 --restart unless-stopped ghcr.io/${{ github.repository_owner }}/anticeil-chat:dev
            else
              docker compose up -d --no-build chat
            fi
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TAG_NAME: ${{ steps.env-config.outputs.DOCKER_TAG }}
