name = "anticeil-automation-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 24/7 Automated Cron Triggers
[triggers]
crons = [
  "0 8 * * *",    # Daily Briefing at 08:00 UTC / WIB
  "*/15 * * * *", # Every 15 mins email / webhook polling
]

