# Example docker-compose snippet for Staging / Dev environment on Oracle VM
# You can append this service to your server's docker-compose.yml:

services:
  # === Staging / Dev Anticeil Chat (dev.chat.anticeil.com) ===
  chat-dev:
    image: ghcr.io/mfaizasysyauqi/anticeil-chat:dev
    container_name: anticeil_chat_dev
    restart: unless-stopped
    ports:
      - "3006:3005"
    environment:
      - NODE_ENV=production
      - VITE_ENABLE_DEV_LOGIN=true
    networks:
      - anticeil_dev_net

networks:
  anticeil_dev_net:
    driver: bridge
